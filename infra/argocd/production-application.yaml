apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: life-planning-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/arifuzzaman-hredoy/life-planning-platform.git
    targetRevision: main
    path: infra/helm/life-planning
    helm:
      valueFiles: [values.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: life-planning
  syncPolicy:
    syncOptions: [CreateNamespace=true]
# Production intentionally has no automated sync. Promote a validated immutable
# image digest/tag through a reviewed Git change, then sync manually.
