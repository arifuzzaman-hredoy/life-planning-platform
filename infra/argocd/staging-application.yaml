apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: life-planning-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/arifuzzaman-hredoy/life-planning-platform.git
    targetRevision: main
    path: infra/helm/life-planning
    helm:
      valueFiles: [values.yaml, values-staging.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: life-planning-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: [CreateNamespace=true]
