global:
  resolve_timeout: 5m

route:
  receiver: local-null
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: local-null

# No external notifier is enabled by default. Add a private receiver only after
# selecting the operator-owned channel and storing its token outside Git.
