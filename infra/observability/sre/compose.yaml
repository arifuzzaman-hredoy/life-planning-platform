name: life-planning-sre

services:
  prometheus:
    image: prom/prometheus:v3.13.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
    ports: ["127.0.0.1:9098:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ${LIFE_PLANNING_METRICS_TOKEN_FILE:?set LIFE_PLANNING_METRICS_TOKEN_FILE}:/run/secrets/metrics.token:ro
      - sre-prometheus:/prometheus
    networks: [app, sre]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m
    cpus: 0.35
    pids_limit: 256

  alertmanager:
    image: prom/alertmanager:v0.32.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports: ["127.0.0.1:9099:9093"]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - sre-alertmanager:/alertmanager
    networks: [sre]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.15
    pids_limit: 128

  loki:
    image: grafana/loki:3.7.7
    command: ["-config.file=/etc/loki/config.yml"]
    ports: ["127.0.0.1:3101:3100"]
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - sre-loki:/loki
    networks: [sre]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 256

  tempo:
    image: grafana/tempo:2.10.7
    command: ["-config.file=/etc/tempo/config.yml"]
    ports: ["127.0.0.1:3201:3200"]
    volumes:
      - ./tempo/config.yml:/etc/tempo/config.yml:ro
      - sre-tempo:/var/tempo
    networks: [sre]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 256

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otelcol/config.yml"]
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./otel/config.yml:/etc/otelcol/config.yml:ro
    networks: [app, sre]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 192m
    cpus: 0.20
    pids_limit: 192

  grafana:
    image: grafana/grafana:13.2.1
    ports: ["127.0.0.1:3301:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://127.0.0.1:3301
    volumes:
      - sre-grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [sre, host_access]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m
    cpus: 0.35
    pids_limit: 256

networks:
  app:
    external: true
    name: life-planning
  sre:
    internal: true
  host_access:
    driver: bridge

volumes:
  sre-prometheus:
  sre-alertmanager:
  sre-loki:
  sre-tempo:
  sre-grafana:
