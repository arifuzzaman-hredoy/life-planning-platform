global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: life-planning
    environment: production

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: life-planning
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics.token
    static_configs:
      - targets: ["life-planning-app:3000"]
        labels:
          app: life-planning
