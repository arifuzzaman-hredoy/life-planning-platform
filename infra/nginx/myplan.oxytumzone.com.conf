# Install only this new vhost after saving a copy of any existing file with this name.
# First issue the certificate with the HTTP-only bootstrap described in docs/deployment.md.
server {
    listen 80;
    listen [::]:80;
    server_name myplan.oxytumzone.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name myplan.oxytumzone.com;
    ssl_certificate /etc/letsencrypt/live/myplan.oxytumzone.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myplan.oxytumzone.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 26m;
    access_log /var/log/nginx/life-planning.access.log;
    error_log /var/log/nginx/life-planning.error.log warn;
    location = /api/metrics { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3217;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }
}
