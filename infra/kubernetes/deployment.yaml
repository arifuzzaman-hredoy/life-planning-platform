apiVersion: apps/v1
kind: Deployment
metadata:
  name: life-planning
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: { app: life-planning }
  template:
    metadata:
      labels: { app: life-planning }
    spec:
      serviceAccountName: life-planning
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: ghcr.io/arifuzzaman-hredoy/life-planning-platform:sha-replace-with-immutable-sha
          imagePullPolicy: IfNotPresent
          command: ["node", "--env-file=/run/secrets/app.env", "server.js"]
          ports: [{ name: http, containerPort: 3000 }]
          envFrom: [{ configMapRef: { name: life-planning-config } }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 640Mi }
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /api/ready, port: http }
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - { name: secret, mountPath: /run/secrets, readOnly: true }
            - { name: temporary, mountPath: /tmp }
            - { name: cache, mountPath: /app/.next/cache }
      volumes:
        - name: secret
          secret:
            secretName: life-planning-secrets
            items:
              - key: app.env
                path: app.env
            defaultMode: 0440
        - name: temporary
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
        - name: cache
          emptyDir: { sizeLimit: 64Mi }
