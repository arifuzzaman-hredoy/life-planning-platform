apiVersion: batch/v1
kind: Job
metadata:
  name: life-planning-migrate-replace-with-immutable-sha
  labels:
    app.kubernetes.io/name: life-planning
    app.kubernetes.io/component: migrator
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: life-planning
        app.kubernetes.io/component: migrator
    spec:
      serviceAccountName: life-planning
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrator
          image: ghcr.io/arifuzzaman-hredoy/life-planning-platform-migrator:sha-replace-with-immutable-sha
          imagePullPolicy: IfNotPresent
          command:
            - node
            - --env-file=/run/secrets/app.env
            - node_modules/prisma/build/index.js
            - migrate
            - deploy
          env:
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          volumeMounts:
            - name: secret
              mountPath: /run/secrets
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: secret
          secret:
            secretName: life-planning-secrets
            items:
              - key: app.env
                path: app.env
            defaultMode: 0440
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
