server {
    listen 80;
    server_name staging.myplan.oxytumzone.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name staging.myplan.oxytumzone.com;

    ssl_certificate /etc/letsencrypt/live/staging.myplan.oxytumzone.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.myplan.oxytumzone.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 26m;

    location = /api/metrics {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3318;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }
}
