apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "life-planning.name" . }}
  labels:
    {{- include "life-planning.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "life-planning.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "life-planning.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "life-planning.name" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - node
            - --env-file=/run/secrets/app.env
            - server.js
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          envFrom:
            - configMapRef:
                name: {{ include "life-planning.name" . }}-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: secret
              mountPath: /run/secrets
              readOnly: true
            - name: temporary
              mountPath: /tmp
            - name: cache
              mountPath: /app/.next/cache
      volumes:
        - name: secret
          secret:
            secretName: {{ .Values.secret.name }}
            items:
              - key: {{ .Values.secret.key }}
                path: app.env
            defaultMode: 0440
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: cache
          emptyDir:
            sizeLimit: 64Mi
