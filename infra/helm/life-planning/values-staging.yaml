replicaCount: 1
image:
  repository: ghcr.io/arifuzzaman-hredoy/life-planning-platform
  tag: replace-with-immutable-sha
config:
  appUrl: https://staging.myplan.oxytumzone.com
secret:
  name: life-planning-staging-secrets
ingress:
  host: staging.myplan.oxytumzone.com
  tlsSecret: life-planning-staging-tls
resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    cpu: "0.5"
    memory: 512Mi
autoscaling:
  enabled: false
podDisruptionBudget:
  enabled: false
