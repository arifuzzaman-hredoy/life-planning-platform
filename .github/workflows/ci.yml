name: Application checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: lifeplanning_ci
          POSTGRES_PASSWORD: ci-disposable-database
          POSTGRES_DB: lifeplanning_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifeplanning_ci -d lifeplanning_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lifeplanning_ci:ci-disposable-database@127.0.0.1:5432/lifeplanning_ci?schema=life_planning
      SESSION_SECRET: ci-only-secret-not-used-in-any-live-environment-123456789
      APP_URL: http://127.0.0.1:3017
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run db:migrate
      - run: npm run test:integration
        env:
          RUN_DB_TESTS: "true"
      - run: python3 -m unittest discover -s scripts -p "test_*.py"
      - run: python3 scripts/validate_platform.py
      - name: Validate environment examples
        run: |
          python3 scripts/validate_env.py .env.example
          python3 scripts/validate_env.py infra/staging/app.env.example
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - uses: hashicorp/setup-terraform@v4
      - run: terraform -chdir=infra/terraform init -backend=false -input=false
      - run: terraform -chdir=infra/terraform validate
      - run: terraform -chdir=infra/terraform fmt -check
      - name: Validate staging Terraform
        run: |
          terraform -chdir=infra/staging/terraform init -backend=false -input=false
          terraform -chdir=infra/staging/terraform validate
          terraform -chdir=infra/staging/terraform fmt -check
      - name: Validate Helm chart rendering
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work alpine/helm:3.18.4 \
            lint infra/helm/life-planning
          docker run --rm -v "$PWD:/work" -w /work alpine/helm:3.18.4 \
            template life-planning infra/helm/life-planning \
            --set image.tag=${{ github.sha }} >/tmp/life-planning-production.yaml
          docker run --rm -v "$PWD:/work" -w /work alpine/helm:3.18.4 \
            template life-planning-staging infra/helm/life-planning \
            -f infra/helm/life-planning/values.yaml \
            -f infra/helm/life-planning/values-staging.yaml \
            --set image.tag=${{ github.sha }} >/tmp/life-planning-staging.yaml
          test -s /tmp/life-planning-production.yaml
          test -s /tmp/life-planning-staging.yaml
      - name: Validate observability configuration
        run: |
          set -euo pipefail
          docker compose --env-file infra/observability/observability.env.example -f infra/observability/compose.yaml config --quiet
          python3 -m json.tool infra/observability/grafana/dashboards/life-planning-overview.json >/dev/null
          printf 'ci-only-metrics-token-not-used-in-production-123456789\n' > /tmp/life-planning-metrics.token
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v /tmp/life-planning-metrics.token:/run/secrets/metrics.token:ro \
            prom/prometheus:v3.13.3 check config /etc/prometheus/prometheus.yml
      - name: Validate optional SRE stack
        env:
          LIFE_PLANNING_METRICS_TOKEN_FILE: /tmp/life-planning-metrics.token
          GRAFANA_ADMIN_USER: ci-admin
          GRAFANA_ADMIN_PASSWORD: ci-only-grafana-password-not-used-in-production
        run: |
          set -euo pipefail
          docker compose -f infra/observability/sre/compose.yaml config --quiet
          python3 -m json.tool infra/observability/sre/grafana/dashboards/slo.json >/dev/null
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/infra/observability/sre/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/infra/observability/sre/prometheus/rules:/etc/prometheus/rules:ro" \
            -v /tmp/life-planning-metrics.token:/run/secrets/metrics.token:ro \
            prom/prometheus:v3.13.3 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/infra/observability/sre/prometheus/rules:/etc/prometheus/rules:ro" \
            prom/prometheus:v3.13.3 check rules /etc/prometheus/rules/life-planning.rules.yml
      - run: docker build --target runner --tag life-planning:ci .
