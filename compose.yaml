# Local development only. Production containers are managed by Terraform.
name: life-planning-dev
services:
  database:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: lifeplanning
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: lifeplanning
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeplanning -d lifeplanning"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
volumes:
  database:
